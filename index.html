<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mukunth Parthasarathy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* Monochrome editorial: black stage, huge condensed type, one photograph, a quiet nav on the right. */
:root{
  --bg:#080808; --fg:#f3f3f1; --mist:#8d8d8a; --dim:#4a4a48; --hair:#222221;
  --ink:#9a9a97; --ember:#d4af6a; --sky:#080808;
  --gold:#d4af6a; --gold-soft:rgba(212,175,106,.55); --gold-dim:rgba(212,175,106,.28);
  --display:"Bebas Neue","Oswald","Arial Narrow",Impact,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  --pad:clamp(20px,4.6vw,96px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:400 1.06rem/1.6 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
::selection{background:var(--fg);color:var(--bg)}
.todo{border-bottom:1px dashed var(--mist);color:var(--mist);font-style:normal}

/* grain */
body::after{content:"";position:fixed;inset:-50%;pointer-events:none;z-index:90;opacity:.07;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain 1.2s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}

/* cursor */
.cur{position:fixed;left:0;top:0;width:10px;height:10px;border-radius:50%;background:#fff;mix-blend-mode:difference;pointer-events:none;z-index:100;
  transform:translate(-50%,-50%);transition:width .35s var(--ease),height .35s var(--ease);display:none}
.cur.big{width:64px;height:64px}
@media (hover:hover) and (pointer:fine){.cur{display:block}}

/* top bar: everything visible, no menu button */
.bar{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;gap:clamp(16px,2.4vw,40px);
  padding:0 var(--pad);height:68px;background:rgba(8,8,8,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-bottom:1px solid transparent;transition:border-color .4s,background .4s;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.bar::-webkit-scrollbar{display:none}
.bar.scrolled{border-color:var(--hair);background:rgba(8,8,8,.82)}
.bar .brand{font:400 1.7rem/1 var(--display);letter-spacing:.02em;flex:none}
.bar .nav{display:flex;gap:clamp(16px,2.2vw,36px);margin:0 auto;flex:none}
.bar .nav a{color:var(--mist);transition:color .3s;font-weight:500;font-size:.98rem}
.bar .nav a:hover,.bar .nav a.on{color:var(--fg)}
.bar .ext{display:flex;gap:clamp(14px,1.8vw,28px);flex:none;font-weight:500;font-size:.98rem}
.bar .ext::before{content:"";width:1px;background:var(--dim);margin-right:clamp(0px,.6vw,10px)}
.ul{position:relative;display:inline-block;padding:4px 0}
.ul::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.5px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .5s var(--ease)}
.ul:hover::after,.ul.on::after{transform:scaleX(1);transform-origin:left}
@media (max-width:860px){
  .bar{height:auto;flex-wrap:wrap;row-gap:6px;column-gap:16px;padding:12px 18px 8px;white-space:normal;overflow:visible}
  .bar .brand{font-size:1.4rem;margin-right:auto}
  .bar .ext{gap:14px;font-size:.86rem}.bar .ext::before{display:none}
  .bar .nav{order:3;width:100%;margin:0;flex-wrap:wrap;justify-content:flex-start;column-gap:14px;row-gap:0}
  .bar .nav a{font-size:.8rem}
  .back{top:96px}
  .page .inner{padding-top:150px}
}

/* hero */
.hero{position:relative;min-height:100svh;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:140px var(--pad) clamp(40px,8vh,110px)}
.hero .photo{position:absolute;top:0;bottom:0;right:0;width:min(54vw,880px);background-size:cover;background-position:50% 18%;
  filter:grayscale(1) contrast(1.12) brightness(.82);
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 42%),linear-gradient(to top,transparent 0,#000 32%);-webkit-mask-composite:source-in;
  mask-image:linear-gradient(to right,transparent 0,#000 42%),linear-gradient(to top,transparent 0,#000 32%);mask-composite:intersect;
  opacity:0;transform:scale(1.04);transition:opacity 1.6s .2s var(--ease),transform 2.4s var(--ease)}
body.ready .hero .photo{opacity:1;transform:none}
@media (max-width:860px){.hero .photo{width:100%;height:58%;bottom:auto;background-position:50% 40%;-webkit-mask-image:linear-gradient(to top,transparent 0,#000 45%);mask-image:linear-gradient(to top,transparent 0,#000 45%)}body.ready .hero .photo{opacity:.8}}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero h1{position:relative;margin:0;font:400 clamp(4.2rem,min(15.6vw,19vh),15.5rem)/.84 var(--display);letter-spacing:-.005em;text-transform:uppercase}
.hero h1 .ln{display:block;overflow:hidden;padding-top:.04em}
.hero h1 .ln>span{display:inline-block;transform:translateY(105%);transition:transform 1.25s var(--ease)}
.hero h1 .ln.out{font-size:.5em;line-height:1;margin-top:.12em}
.hero h1 .ln.out>span{color:transparent;-webkit-text-stroke:1.2px var(--fg);letter-spacing:.01em}
body.ready .hero h1 .ln>span{transform:none}
.hero h1 .ch{display:inline-block;transition:transform .5s var(--ease)}
.hero .blurb{position:relative;max-width:34rem;margin:clamp(28px,5vh,56px) 0 0;color:#cfcfcc;font-size:clamp(1.05rem,1.35vw,1.32rem);line-height:1.5;
  opacity:0;transform:translateY(16px);transition:opacity 1s .7s var(--ease),transform 1s .7s var(--ease)}
body.ready .hero .blurb{opacity:1;transform:none}
.hero .hint{position:absolute;left:var(--pad);top:96px;font:400 .78rem var(--mono);color:var(--mist);letter-spacing:.06em;text-transform:uppercase}
.hero .hint b{color:var(--fg);font-weight:400}
@media (max-width:860px){.hero .hint{display:none}}

/* sections */
section.s{padding:clamp(90px,16vh,190px) var(--pad);border-top:1px solid var(--hair);position:relative}
.wrap{max-width:1500px;margin:0 auto}
.lbl{font:400 .8rem var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mist)}
.lbl b{color:var(--fg);font-weight:400}
.giant{font:400 clamp(4rem,13vw,12.5rem)/.85 var(--display);text-transform:uppercase;margin:14px 0 0;letter-spacing:-.005em}
.giant .ln{display:block;overflow:hidden}
.giant .ln>span{display:inline-block;transform:translateY(105%);transition:transform 1.1s var(--ease)}
.in .giant .ln>span,.giant.in .ln>span{transform:none}
.rv{opacity:0;transform:translateY(28px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
.rv.in{opacity:1;transform:none}

.about{display:grid;grid-template-columns:1fr 1.25fr;gap:clamp(30px,6vw,110px);margin-top:clamp(40px,7vh,90px)}
.about .state{font:400 clamp(2rem,3.6vw,3.6rem)/1.02 var(--display);text-transform:uppercase}
.about .state em{font-style:normal;color:transparent;-webkit-text-stroke:1px var(--fg)}
.about p{color:#c9c9c6;margin:0 0 1.1em;max-width:40rem}
.now{margin-top:34px;border-top:1px solid var(--hair)}
.now div{display:grid;grid-template-columns:9rem 1fr;gap:16px;padding:13px 0;border-bottom:1px solid var(--hair)}
.now span:first-child{font:400 .76rem/1.9 var(--mono);color:var(--mist);text-transform:uppercase;letter-spacing:.06em}
@media (max-width:860px){.about{grid-template-columns:1fr}.now div{grid-template-columns:1fr;gap:2px}}

/* work rows */
.rows{margin-top:clamp(40px,7vh,90px);border-top:1px solid var(--hair)}
.row{position:relative;display:grid;grid-template-columns:4.5rem 1fr auto;gap:clamp(12px,2vw,36px);align-items:baseline;padding:clamp(20px,3.2vh,34px) 0;border-bottom:1px solid var(--hair);
  transition:padding .5s var(--ease),color .4s}
.row .n{font:400 .8rem var(--mono);color:var(--mist)}
.row h3{margin:0;font:400 clamp(2.1rem,4.6vw,4.6rem)/.95 var(--display);text-transform:uppercase;transition:transform .6s var(--ease)}
.row p{margin:8px 0 0;color:var(--mist);max-width:44rem;font-size:.98rem}
.row .meta{text-align:right;font:400 .78rem/1.7 var(--mono);color:var(--mist);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.row .meta b{display:inline-block;color:var(--fg);font-weight:400;border:1px solid var(--dim);border-radius:999px;padding:1px 10px;margin-bottom:6px}
.rows:hover .row{color:var(--dim)}
.rows:hover .row:hover{color:var(--fg)}
.rows .row:hover h3{transform:translateX(18px)}
@media (max-width:860px){.row{grid-template-columns:1fr}.row .meta{text-align:left}.row .n{display:none}}

/* floating preview that follows the cursor over rows */
.peek{position:fixed;left:0;top:0;width:340px;height:230px;pointer-events:none;z-index:30;border-radius:6px;overflow:hidden;background:#111;border:1px solid var(--hair);
  opacity:0;transform:translate(-50%,-50%) scale(.85) rotate(-3deg);transition:opacity .35s var(--ease),transform .5s var(--ease)}
.peek.on{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}
.peek canvas{width:100%;height:100%;display:block}
.peek span{position:absolute;left:12px;bottom:10px;font:400 .72rem var(--mono);color:var(--mist);text-transform:uppercase}
@media (hover:none){.peek{display:none}}

/* achievements */
.aw{display:grid;grid-template-columns:10rem 1fr;gap:clamp(14px,3vw,50px);padding:26px 0;border-bottom:1px solid var(--hair)}
.aw .yr{font:400 .8rem/2.2 var(--mono);color:var(--mist)}
.aw h3{margin:0;font:600 clamp(1.15rem,1.7vw,1.5rem)/1.3 var(--body)}
.aw p{margin:6px 0 0;color:var(--mist);max-width:46rem}
.aw a{font-size:.95rem;color:var(--fg)}
@media (max-width:860px){.aw{grid-template-columns:1fr;gap:2px}}
.ecell{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--hair);margin-top:60px;border:1px solid var(--hair)}
.ecell div{background:var(--bg);padding:26px}
.ecell .lbl{display:block;margin-bottom:10px}
.ecell h4{margin:0 0 8px;font:400 2.2rem/1 var(--display);text-transform:uppercase}
.ecell p{margin:0;color:var(--mist);font-size:.95rem}
@media (max-width:860px){.ecell{grid-template-columns:1fr}}


/* events */
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-top:clamp(36px,6vh,70px)}
.filters button{font:500 .95rem var(--body);color:var(--fg);background:none;border:1px solid var(--dim);border-radius:999px;padding:9px 18px;cursor:pointer;transition:background .3s,color .3s,border-color .3s}
.filters button.on,.filters button:hover{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.filters button span{opacity:.6;margin-left:6px;font:400 .78rem var(--mono)}
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));margin-top:26px;padding:1px 0 0 1px}
.ev{position:relative;background:var(--bg);border:1px solid var(--hair);margin:-1px 0 0 -1px;padding:28px 26px 30px;min-height:230px;display:flex;flex-direction:column;overflow:hidden;transition:opacity .45s var(--ease),transform .45s var(--ease)}
.ev::before{content:"";position:absolute;inset:0;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.09),transparent 45%);opacity:0;transition:opacity .4s}
.ev:hover::before{opacity:1}
.ev.hide{display:none}
.ev .k{display:flex;justify-content:space-between;gap:12px;font:400 .74rem var(--mono);color:var(--mist);text-transform:uppercase;letter-spacing:.06em}
.ev .k b{color:var(--fg);font-weight:400;border:1px solid var(--dim);border-radius:999px;padding:1px 9px}
.ev h4{margin:auto 0 0;padding-top:34px;font:400 clamp(2rem,2.8vw,2.7rem)/.95 var(--display);text-transform:uppercase;transition:transform .5s var(--ease)}
.ev:hover h4{transform:translateY(-6px)}
.ev p{margin:10px 0 0;color:var(--mist);font-size:.95rem}

/* skills + education */
.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,6vw,110px);margin-top:clamp(40px,7vh,90px)}
.sk{padding:18px 0;border-bottom:1px solid var(--hair)}
.sk h4{margin:0 0 8px;font:400 .78rem var(--mono);color:var(--mist);text-transform:uppercase;letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{border:1px solid var(--dim);border-radius:999px;padding:4px 13px;font-size:.92rem;transition:background .3s,color .3s}
.chips span:hover{background:var(--fg);color:var(--bg)}
.edu div{display:flex;justify-content:space-between;gap:20px;padding:18px 0;border-bottom:1px solid var(--hair)}
.edu div span:last-child{color:var(--mist);font:400 .85rem/1.9 var(--mono)}
@media (max-width:860px){.split{grid-template-columns:1fr}}

/* contact */
.contact .big{display:inline-block;font:400 clamp(4.4rem,17vw,17rem)/.82 var(--display);text-transform:uppercase;margin-top:20px}
.contact .big .ln{display:block;overflow:hidden}
.contact .big .ln>span{display:inline-block;transform:translateY(105%);transition:transform 1.1s var(--ease)}
.contact.in .big .ln>span{transform:none}
.contact .big:hover .ln.out>span{color:var(--fg)}
.contact .big .ln.out>span{color:transparent;-webkit-text-stroke:1.5px var(--fg);transition:transform 1.1s var(--ease),color .5s}
.contact .links{display:flex;flex-wrap:wrap;gap:16px 40px;margin-top:50px;font-weight:500;font-size:1.1rem}
footer{padding:40px var(--pad);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;color:var(--mist);font:400 .78rem var(--mono);text-transform:uppercase;border-top:1px solid var(--hair)}

/* project page (overlay) */
.page{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;transform:translateY(100%);transition:transform .9s var(--ease);visibility:hidden}
.page.open{transform:none;visibility:visible}
.page .inner{padding:clamp(130px,18vh,190px) var(--pad) 80px}
.back{position:fixed;left:var(--pad);top:84px;z-index:52;background:rgba(8,8,8,.7);font-weight:500;opacity:0;pointer-events:none;transition:opacity .4s}
body.proj .back{opacity:1;pointer-events:auto}
.ph h1{margin:16px 0 0;font:400 clamp(3.4rem,10.5vw,10rem)/.86 var(--display);text-transform:uppercase}
.ph .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--hair);border:1px solid var(--hair);margin:clamp(36px,6vh,70px) 0}
.ph .facts div{background:var(--bg);padding:18px 20px}
.ph .facts span{display:block;font:400 .74rem var(--mono);color:var(--mist);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.pcanvas{height:clamp(240px,42vh,460px);border:1px solid var(--hair);border-radius:6px;overflow:hidden;position:relative}
.pcanvas canvas{width:100%;height:100%;display:block}
.pcanvas span{position:absolute;left:14px;bottom:12px;font:400 .72rem var(--mono);color:var(--mist);text-transform:uppercase}
.pbody{display:grid;grid-template-columns:1fr 1.3fr;gap:clamp(30px,6vw,110px);margin-top:clamp(50px,8vh,100px)}
.pbody .lead{font:400 clamp(1.7rem,2.8vw,2.7rem)/1.05 var(--display);text-transform:uppercase}
.pbody ol{margin:0;padding:0;list-style:none;counter-reset:k}
.pbody li{counter-increment:k;display:grid;grid-template-columns:3rem 1fr;padding:16px 0;border-bottom:1px solid var(--hair);color:#d2d2cf}
.pbody li::before{content:counter(k,decimal-leading-zero);font:400 .78rem/2 var(--mono);color:var(--mist)}
.note{margin-top:22px;padding:14px 16px;border-left:2px solid var(--fg);color:#d2d2cf;background:#111}
.nums{display:flex;gap:40px;flex-wrap:wrap;margin-top:30px}
.nums b{display:block;font:400 3.6rem/1 var(--display)}
.nums span{color:var(--mist);font-size:.92rem}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:clamp(50px,8vh,100px)}
.figs div{aspect-ratio:4/3;border:1px dashed var(--dim);border-radius:6px;display:flex;align-items:flex-end;padding:14px;font:400 .76rem var(--mono);color:var(--mist);text-transform:uppercase}
.tools{margin-top:26px}
.pnav{display:flex;justify-content:space-between;gap:20px;margin-top:clamp(70px,12vh,140px);border-top:1px solid var(--hair);padding-top:28px}
.pnav a{display:block;max-width:48%}
.pnav span{display:block;font:400 .76rem var(--mono);color:var(--mist);text-transform:uppercase}
.pnav b{font:400 clamp(1.6rem,3vw,2.8rem)/1 var(--display);text-transform:uppercase;font-weight:400}
.code{margin-top:28px;font-weight:500}
.code a{border-bottom:1px solid var(--fg)}
@media (max-width:860px){.pbody{grid-template-columns:1fr}}


/* ---------- reactive extras ---------- */
.prog{position:fixed;top:68px;left:0;right:0;height:2px;background:var(--fg);transform-origin:left;transform:scaleX(0);z-index:61;pointer-events:none}
@media (max-width:860px){.prog{top:auto;bottom:0}}
.cta{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:30px;opacity:0;transform:translateY(16px);transition:opacity 1s .95s var(--ease),transform 1s .95s var(--ease)}
body.ready .cta{opacity:1;transform:none}
.btn{position:relative;display:inline-flex;align-items:center;gap:10px;padding:14px 24px;border-radius:999px;border:1px solid var(--dim);font-weight:600;font-size:.98rem;overflow:hidden;isolation:isolate;transition:border-color .3s,color .35s}
.btn::before{content:"";position:absolute;inset:0;background:var(--fg);border-radius:inherit;transform:translateY(101%);transition:transform .5s var(--ease);z-index:-1}
.btn:hover{color:var(--bg);border-color:var(--fg)}
.btn:hover::before{transform:none}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.primary::before{background:#bdbdb8}
.btn svg{width:16px;height:16px;transition:transform .4s var(--ease)}
.btn:hover svg{transform:translateY(2px)}
.icon{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:50%;border:1px solid var(--dim);transition:background .3s,color .3s,border-color .3s,transform .3s var(--ease)}
.icon:hover{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.icon svg{width:19px;height:19px}
.rail{position:fixed;left:22px;bottom:30px;z-index:40;display:flex;flex-direction:column;align-items:center;gap:16px;transition:opacity .4s}
.rail::after{content:"";width:1px;height:70px;background:var(--dim)}
.rail a{color:var(--mist);transition:color .3s,transform .3s var(--ease)}
.rail a:hover{color:var(--fg);transform:translateY(-3px)}
.rail svg{width:18px;height:18px;display:block}
body.proj .rail{opacity:0;pointer-events:none}
@media (max-width:1100px){.rail{display:none}}
.marquee{overflow:hidden;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:26px 0;white-space:nowrap;user-select:none}
.marquee .track{display:inline-flex;gap:48px;will-change:transform}
.marquee span{font:400 clamp(2.4rem,5.4vw,5rem)/1 var(--display);text-transform:uppercase}
.marquee span.o{color:transparent;-webkit-text-stroke:1px var(--fg)}
.marquee i{font-style:normal;color:var(--mist);font:400 clamp(1.6rem,3vw,2.6rem)/1.4 var(--display)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--hair);border:1px solid var(--hair);margin-top:clamp(50px,8vh,90px)}
.stats div{background:var(--bg);padding:26px 24px}
.stats b{display:block;font:400 clamp(3rem,6vw,5.4rem)/1 var(--display)}
.stats span{color:var(--mist);font-size:.95rem}
.stats .tx{display:flex;flex-direction:column;gap:4px}
.stats .tx .k{font:400 .74rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--mist);margin-bottom:6px}
.stats .tx b.t{font:400 clamp(1.5rem,2.2vw,2.1rem)/1.05 var(--display);color:var(--fg)}
.stats .tx b.t:first-of-type{color:var(--gold)}
.stats .tx ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:.92rem;color:#d2d2cf}
.stats .tx ul b{display:inline;font:400 1.25rem/1 var(--display);color:var(--gold);letter-spacing:.02em}
@media (max-width:860px){.stats{grid-template-columns:1fr 1fr}.stats .tx{grid-column:span 2}}
/* project deep dive */
.story{margin-top:clamp(60px,10vh,110px);border-top:1px solid var(--hair)}

/* photos: event covers, figures, lightbox */

const PROJECTS = [
  {
    id:"bis", group:"Research", title:"Bioimpedance Spectroscopy Prototype",
    short:"Wearable hydration-monitoring research at IIT Madras: a custom current-source PCB, an analog front end and automated calibration.",
    status:["done","Hardware"], period:"Jun – Jul 2026", role:"Research Intern, IITM Measurements & Instrumentation Lab",
    with:"Supervisor: Prof. Boby George",
    tools:["Current-source PCB","Analog front end","Analog Discovery 2","Python","Calibration"],
    story:[["Where it started", "When I joined the Measurements & Instrumentation Lab at IIT Madras, Prof. Boby George didn't hand me a fixed project. He asked me to come up with my own idea for a wearable that uses sensors with the human body as the subject. After a few days of thinking, I settled on hydration: it affects how the body and brain perform, yet there is no wearable that tracks the body's water continuously. Today it's mostly manual logging, or sweat patches that only estimate what you lose while you're sweating."], ["The idea: a ring that listens to your cells", "Bioimpedance spectroscopy passes a tiny alternating current through tissue at many frequencies and measures how hard the tissue resists it. Low-frequency current flows around cells, through the fluid outside them. High-frequency current passes through cell membranes, which behave like small capacitors. Sweeping the frequency therefore separates the water outside cells from the water inside them, and both relate to hydration. My design puts this into a ring with four ring electrodes on the finger."], ["Why four electrodes", "Two outer rings (I+ and I−) inject the current, and two inner rings (V+ and V−) only measure voltage. Keeping current injection and voltage sensing separate means the contact between electrode and skin does not get mixed into the reading, which matters a lot on a wearable where that contact keeps changing."], ["What I built", "I designed the circuit and the PCB from scratch: a custom current source that drives the electrodes, and an analog front end that picks up the voltage across the tissue. An Analog Discovery 2 generates the frequency sweep and captures both the voltage and current signals. At each frequency I run a single-bin DFT to pull out just that frequency's component, giving the impedance as a complex value with both magnitude and phase. A complex calibration removes the setup's own frequency-dependent errors (stray reactance), and the whole sweep and calibration are automated so every run is repeatable."], ["Where it's heading", "Next is an ML model that maps the impedance spectrum to hydration level, and turning the bench setup into a finished ring prototype."]],
    overview:"A bioimpedance spectroscopy prototype built for wearable hydration-monitoring research. It measures how the impedance of a sample changes across several excitation frequencies.",
    points:[
      "Designed the prototype around a custom current-source PCB and analog front end.",
      "Automated the calibration routine and the multi-frequency impedance-sweep instrumentation.",
      "Next stage (planned): an ML model mapping impedance to hydration level."
    ],
    figs:[{src:"assets/bis-electrode.jpg",cap:"Four-ring electrode PCB layout: current rings (I+, I−) and voltage rings (V+, V−)"},{src:"assets/bis-setup.jpg",cap:"Bench setup: Analog Discovery 2, the analog front end and the ring electrode"},{src:"assets/bis-sweep.jpg",cap:"Impedance sweep from 1 kHz to 400 kHz: Cole-Cole plot, magnitude and phase"}]
  },
  {
    id:"bat-wing", group:"Research", title:"Bat-Inspired Flapping-Wing UAV",
    short:"Honors research: a PyBullet simulation comparing rigid and compliant membrane wings for efficiency, power and gust response.",
    status:["sim","Simulation"], period:"Jan 2026 – present", role:"Honors researcher, IIIT Sri City",
    with:"Mentor: Dr. Sakthi Swarrup",
    tools:["Python","PyBullet","Blade-element aerodynamics","Sensitivity & ablation studies"],
    numbers:[["+20.6%","lift-to-drag vs rigid wing (simulation)"],["−43.7%","peak power (simulation)"],["47–54%","lower gust pitching moments (simulation)"]],
    story:[["Why bats", "Micro air vehicles fly at the same small scales as bats and struggle with the same things: low lift-to-drag ratio, sensitivity to gusts, high actuator power and tight mass budgets. A bat wing is a thin elastic membrane that cambers on every wingbeat, stores and returns elastic energy and damps gusts, a combination no rigid wing offers. These effects had been studied separately; I wanted one physically consistent model that measures all of them together."], ["The model", "I built a biologically parameterised multibody model of a Pteropus giganteus (large flying fox) wing in PyBullet. The skeleton has a shoulder and an elbow (2 degrees of freedom) tracked with PD control at 960 Hz. The membrane is a 6 × 3 spring–damper mesh on each panel, with stiffness set from the skin's elastic modulus and thickness, and aerodynamics come from quasi-steady blade-element theory. The rigid baseline is the exact same model with every membrane force switched off, so any difference comes from the membrane alone."], ["What I measured", "Cycle-integrated lift-to-drag ratio, mean and peak joint power, cost of transport, elastic energy storage and recovery, and the response to 2 m/s head-, cross- and updraft gusts. On top of that: stiffness and pretension sweeps, ±20% sensitivity tests and a five-configuration ablation that adds one membrane mechanism at a time."], ["What the simulation shows", "Over ten flapping cycles, the compliant membrane gave +20.6% lift-to-drag, −9.9% mean power, −43.7% peak power, −10.3% cost of transport and 47–54% lower gust-induced pitching moments than the rigid wing, with no added sensors, actuators or mass. The ablation shows elastic compliance drives most of the lift-to-drag gain, while damping drives most of the gust reduction. Real bat skin properties land close to the model's aerodynamic optimum."], ["Limits and next steps", "These are simulation results, not flight tests. The aerodynamics are quasi-steady (no leading-edge vortex or wake capture) and the mesh is coarse and isotropic. Next steps are coupled fluid–structure simulation, an anisotropic membrane, a wind-tunnel prototype and learning-based gust control. The work is written up as a manuscript for journal submission, and the code is on GitHub."]],
    overview:"Bats fly with thin, compliant membrane wings that change camber as they flap. This study asks whether that compliance improves performance over a rigid wing of the same shape, using a physics simulation built on published biological data.",
    points:[
      "Modeled rigid and compliant bat-inspired wings in Python/PyBullet using published biological data.",
      "Quantified how stiffness, pretension and damping affect aerodynamic efficiency, power demand and gust response through sensitivity and ablation studies.",
      "Prepared the manuscript for journal submission.",
      "Presented as a poster at the Utkrista 2026 Research Expo, where it received an Honorable Mention."
    ],
    note:"All results are from simulation; no physical wing has been tested.",
    link:'<a class="u" href="https://github.com/mukunthparthasarathyb24-collab/honors-bat-inspired-flight-simulation-v2" target="_blank" rel="noopener">github.com/…/honors-bat-inspired-flight-simulation-v2</a> · <a class="u" href="assets/honors-poster.pdf" target="_blank" rel="noopener">Poster (PDF)</a>',
    figs:[{src:"assets/honors-mesh.jpg",cap:"Membrane wing model: spring-damper mesh on a Pteropus giganteus planform",fit:1},{src:"assets/honors-forces.jpg",cap:"Simulated force profiles: rigid-link vs deformable membrane wing",fit:1},{src:"assets/honors-ablation.jpg",cap:"Ablation study: what each membrane mechanism contributes (simulation)",fit:1},{src:"assets/honors-poster.jpg",cap:"The full Research Expo 2026 poster",fit:1},{src:"assets/poster-1.jpg",cap:"With my poster at the Utkrista 2026 Research Expo"},{src:"assets/poster-2.jpg",cap:"Walking visitors through the results"}]
  },
  {
    id:"drone", group:"Research", title:"Autonomous Disaster-Management Drone",
    short:"Aerial Robotics Lab: a digital replica of our campus in Unreal Engine/AirSim for autonomous drones in GPS-denied disaster zones.",
    status:["ongoing","Ongoing"], period:"Aug 2026 – present", role:"Student Researcher, Aerial Robotics Lab, IIIT Sri City",
    with:"Under Dr. Raja Vara Prasad",
    tools:["Unreal Engine","AirSim","Python","NVIDIA Jetson","Computer vision"],
    story:[["The problem", "After a disaster, collapsed buildings and debris often block GPS, which is exactly when a drone would be most useful for search and mapping. Our lab project is an autonomous drone that can find its way through these GPS-denied areas."], ["Simulation first", "Before flying real hardware, we built a digital replica of the IIIT Sri City campus in Unreal Engine with AirSim. That gives us a safe place to develop and test: buildings, trees and roads at real scale, with the drone controlled through AirSim's API."], ["What works so far", "In simulation we have demonstrated autonomous flight, trajectory planning and obstacle avoidance in GPS-denied scenarios. We trained an obstacle-segmentation model on simulated camera frames, which marks trees and buildings as obstacles pixel by pixel, and deployed image recognition on NVIDIA Jetson hardware."], ["What we're building now", "Mapping, localisation and sensor fusion: building a 3D map of the surroundings (the point cloud on this page) while working out where the drone is within it. This is still in progress, and it is the step before full integration on the physical drone."]],
    overview:"Autonomous drones for disaster zones where GPS doesn't reach, developed first in a simulated copy of the IIIT Sri City campus before moving to hardware.",
    points:[
      "We built a digital replica of the college campus in Unreal Engine/AirSim.",
      "We demonstrated autonomous flight, trajectory planning and obstacle avoidance in GPS-denied scenarios in simulation.",
      "We deployed image recognition on NVIDIA Jetson hardware.",

    ],
    note:"Mapping and localization are work in progress.",
    figs:[{src:"assets/drone-campus.jpg",cap:"Our campus replica in Unreal Engine/AirSim, with the drone and its flight path"},{src:"assets/drone-pointcloud.jpg",cap:"Point cloud of the simulated campus with the drone\u2019s flight path (mapping work in progress)"},{src:"assets/drone-segmentation.jpg",cap:"Obstacle segmentation on simulated frames: ground truth, predicted probability and overlay"},"Photo: Jetson on the bench"]
  },
  {
    id:"rover", group:"Hardware & embedded", title:"PIVOT-170 Autonomous Rover",
    short:"Round 1 of Utkrista 2026 Connect & Sync (1st place overall, team of 4): an obstacle-avoiding rover designed from chassis to PCB layout and tested with a digital twin.",
    status:["done","1st place"], period:"2026", role:"Design and simulation, team of 4",
    with:"Utkrista 2026 Connect & Sync · Round 1",
    tools:["Autodesk Fusion 360","PCB layout","Wokwi","ESP32","HC-SR04","MPU-6050","Digital twin"],
    story:[["The challenge", "Round 1 of Utkrista 2026 Connect & Sync: design an autonomous rover that detects obstacles and steers around them. Our design, PIVOT-170, is a 170 mm round robot with centre-axle differential drive, so it can turn on the spot."], ["Hardware design", "I designed the two-deck chassis in Autodesk Fusion 360: TT motors and wheels, a ball caster, a 2S 18650 battery pack, a power switch, standoffs and three HC-SR04 ultrasonic sensors facing forward and ±40° to the sides. I also laid out the 80 × 60 mm main board (component placement; traces not routed)."], ["Circuit validation", "Before building anything, we validated the full circuit in Wokwi: an ESP32 running the firmware, the three ultrasonic sensors, an MPU-6050 gyro and accelerometer over I2C, a TB6612FNG motor driver, battery-voltage sensing, a bumper input, a status LED and buzzer, and a logic analyser recording the motor signals."], ["The digital twin", "I built a digital twin in which the actual firmware controller, compiled to WebAssembly, drives a simulated rover. You can pick scenarios, drop new obstacles onto the floor and tune the stop distance, cruise speed and time-to-collision live. The videos show two of them: S3, where the rover turns toward the open side of a wall by a gyro-measured angle, and S6b, a tight dead end where both side sensors read closed and the trap logic commands a 180° escape."], ["Result", "Our team of four went on to win first place overall at Utkrista 2026 Connect & Sync."]],
    overview:"The first round of a two-round hardware hackathon: design an autonomous rover that detects and steers around obstacles.",
    points:[
      "Designed the rover's 3D chassis in Autodesk and its PCB layout.",
      "Validated the circuit in Wokwi before building anything.",
      "Built a digital twin in which the actual firmware controller, compiled to WebAssembly, drives a simulated rover, to test how it reacts to scenarios such as walls, dead ends and newly added obstacles.",
      "Our team went on to win first place overall."
    ],
    link:'<a class="u" href="https://github.com/mukunthparthasarathyb24-collab/PIVOT-170-Obstacle-Avoider" target="_blank" rel="noopener">github.com/…/PIVOT-170-Obstacle-Avoider</a>',
    figs:[{video:"assets/rover-avoidance-turn.mp4",src:"assets/rover-avoidance-turn.jpg",cap:"Digital twin, scenario S3: the controller turns the rover toward the open side of a wall"},{video:"assets/rover-dead-end-escape.mp4",src:"assets/rover-dead-end-escape.jpg",cap:"Digital twin, scenario S6b: trapped in a dead end, the rover pivots 180° to escape"},{src:"assets/rover-fusion.jpg",cap:"Chassis assembly in Autodesk Fusion 360 (3D model)"},{src:"assets/rover-wokwi.jpg",cap:"Circuit validated in Wokwi: ESP32, three HC-SR04 sensors, MPU-6050 gyro and TB6612FNG motor driver",fit:1},{src:"assets/rover-pcb.jpg",cap:"Main board rev A: component placement, 80 × 60 mm (traces not routed)",fit:1}]
  },

    id:"septisense", group:"Hardware & embedded", title:"SeptiSense Sepsis Early-Warning Wearable",
    short:"Round 2 of Utkrista 2026 Connect & Sync (1st place overall): I built the wearable's sensing hardware and signal processing for an ML sepsis early-warning system.",
    status:["done","1st place"], period:"2026", role:"Sensing hardware and firmware, team of 4",

/* ---------- small live drawings, one per project ---------- */
function drawIllo(kind, ctx, w, h, t, m){
  const ink=css("--ink"), em=css("--ember"), hair=css("--hair");
  ctx.clearRect(0,0,w,h); ctx.lineCap="round"; ctx.lineJoin="round";
  const mx = m ? m.x : .5, my = m ? m.y : .5;
  if(kind==="bis"){ // frequency sweep 10–100 kHz; cursor scrubs
    const f = m ? mx : (Math.sin(t/2600)+1)/2;
    ctx.strokeStyle=hair;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.stroke();
    ctx.strokeStyle=em;ctx.lineWidth=2.2;ctx.beginPath();
    const cyc=2+f*16;
    for(let x=0;x<=w;x+=2){const y=h/2+Math.sin(x/w*cyc*Math.PI*2 - t/300)*h*.22*Math.exp(-((x/w-.5)**2)*1.2);x?ctx.lineTo(x,y):ctx.moveTo(x,y)}
    ctx.stroke();
    for(let k=0;k<10;k++){const x=w*(.08+k*.093);const lit=k/9<=f+.001;ctx.fillStyle=lit?em:hair;ctx.beginPath();ctx.arc(x,h*.86,4,0,7);ctx.fill()}
    ctx.fillStyle=ink;ctx.font="500 12px DM Mono, monospace";ctx.fillText(`${Math.round(10+f*90)} kHz`,w*.06,h*.14);
  } else if(kind==="bat"){ // flapping membrane wing; cursor sets amplitude
    const amp=(m?(1-my):.6)*.9+.15, ph=Math.sin(t/260)*amp;
    const sx=w*.24, sy=h*.68;
    const el=[sx+w*.24*Math.cos(ph*.6), sy-h*.24*Math.sin(ph*.9)];
    const wr=[el[0]+w*.22*Math.cos(ph*1.1-.2), el[1]-h*.2*Math.sin(ph*1.2)];
    const tips=[[wr[0]+w*.18,wr[1]+h*.05],[wr[0]+w*.12,wr[1]+h*.2],[wr[0]+w*.02,wr[1]+h*.3]];
    ctx.fillStyle=em;ctx.globalAlpha=.16;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(el[0],el[1]);ctx.lineTo(wr[0],wr[1]);
    tips.forEach((p,i)=>{const prev=i?tips[i-1]:wr;ctx.quadraticCurveTo((prev[0]+p[0])/2,(prev[1]+p[1])/2+h*.05*(1+ph),p[0],p[1])});
    ctx.quadraticCurveTo(w*.42,sy+h*.32,sx,sy+h*.1);ctx.closePath();ctx.fill();ctx.globalAlpha=1;
    ctx.strokeStyle=ink;ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(el[0],el[1]);ctx.lineTo(wr[0],wr[1]);ctx.stroke();
    ctx.lineWidth=1.4;tips.forEach(p=>{ctx.beginPath();ctx.moveTo(wr[0],wr[1]);ctx.lineTo(p[0],p[1]);ctx.stroke()});
    ctx.fillStyle=ink;ctx.beginPath();ctx.ellipse(sx-8,sy+h*.04,14,9,0,0,7);ctx.fill();
  } else if(kind==="rover"){ // rover weaving between obstacles; cursor is an obstacle
    const obs=[[.35,.35],[.6,.65],[.8,.3]]; if(m)obs.push([mx,my]);
    ctx.strokeStyle=hair;ctx.lineWidth=1;ctx.setLineDash([3,5]);ctx.beginPath();
    let px=0,py=.5,pts=[];
    for(let x=0;x<=1.001;x+=.01){let y=.5;obs.forEach(([ox,oy])=>{const d=x-ox;y+=(py<oy?-1:1)*.22*Math.exp(-d*d/.006)*(Math.abs(oy-.5)<.35?1:.3)*(oy>.5?-1:1)*-1});pts.push([x,y])}
    pts.forEach(([x,y],i)=>i?ctx.lineTo(x*w,y*h):ctx.moveTo(x*w,y*h));ctx.stroke();ctx.setLineDash([]);
    obs.forEach(([ox,oy],i)=>{ctx.fillStyle=i===3?em:ink;ctx.globalAlpha=i===3?.35:.85;ctx.beginPath();ctx.arc(ox*w,oy*h,i===3?16:11,0,7);ctx.fill()});ctx.globalAlpha=1;
    const k=Math.floor((t/28)%pts.length), [rx,ry]=pts[k], [nx,ny]=pts[Math.min(k+1,pts.length-1)];
    ctx.save();ctx.translate(rx*w,ry*h);ctx.rotate(Math.atan2((ny-ry)*h,(nx-rx)*w));ctx.fillStyle=em;ctx.fillRect(-13,-8,26,16);ctx.fillStyle=ink;[-8,8].forEach(a=>{ctx.fillRect(-11,a-3,7,6);ctx.fillRect(4,a-3,7,6)});ctx.restore();
  } else if(kind==="drone"){ // quad hovering; cursor is its setpoint
    const tx=(m?mx:.5+.25*Math.sin(t/1500))*w, ty=(m?my:.45+.15*Math.sin(t/1100))*h;
    const st=drawIllo.st||(drawIllo.st={x:w/2,y:h/2});st.x+=(tx-st.x)*.06;st.y+=(ty-st.y)*.06;
    ctx.strokeStyle=hair;ctx.setLineDash([2,6]);ctx.beginPath();ctx.moveTo(st.x,st.y);ctx.lineTo(tx,ty);ctx.stroke();ctx.setLineDash([]);
    ctx.strokeStyle=em;ctx.beginPath();ctx.arc(tx,ty,6,0,7);ctx.stroke();
    ctx.strokeStyle=ink;ctx.lineWidth=3;const a=22;ctx.beginPath();ctx.moveTo(st.x-a,st.y-a);ctx.lineTo(st.x+a,st.y+a);ctx.moveTo(st.x+a,st.y-a);ctx.lineTo(st.x-a,st.y+a);ctx.stroke();
    [[-a,-a],[a,a],[a,-a],[-a,a]].forEach(([dx,dy],i)=>{ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(st.x+dx,st.y+dy,13,13*Math.abs(Math.sin(t/40+i)),0,0,7);ctx.stroke()});
  } else if(kind==="step"){ // PID vs RL step response
    const z=m?.15+mx*.8:.35;
    const plot=(f,c,wd)=>{ctx.strokeStyle=c;ctx.lineWidth=wd;ctx.beginPath();for(let x=0;x<=w;x+=2){const s=x/w*10;const y=h*.8-h*.55*f(s);x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()};
    ctx.strokeStyle=hair;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(0,h*.25);ctx.lineTo(w,h*.25);ctx.stroke();ctx.setLineDash([]);
    plot(s=>1-Math.exp(-z*s*1.4)*(Math.cos(s*1.6)+z*Math.sin(s*1.6)),ink,2);
    plot(s=>1-Math.exp(-s*.9)*(1+.15*Math.sin(s*3+t/400)),em,2);
    ctx.fillStyle=css("--mist");ctx.font="12px DM Mono, monospace";ctx.fillText("PID",w*.82,h*.18);ctx.fillStyle=em;ctx.fillText("PPO",w*.82,h*.12);
  } else if(kind==="cells"){ // QCA cells
    const n=7,s=Math.min(w,h)/(n+2);
    for(let i=0;i<n;i++)for(let j=0;j<n;j++){const x=(w-n*s)/2+i*s,y=(h-n*s)/2+j*s;const on=Math.sin(i*.9+j*.7-t/500+(m?(mx-i/n)*4:0))>0;
      ctx.strokeStyle=hair;ctx.strokeRect(x+3,y+3,s-6,s-6);ctx.fillStyle=on?em:ink;ctx.globalAlpha=on?.9:.5;
      const d=s*.16;(on?[[d,d],[s-d,s-d]]:[[s-d,d],[d,s-d]]).forEach(([a,b])=>{ctx.beginPath();ctx.arc(x+a,y+b,s*.08,0,7);ctx.fill()});ctx.globalAlpha=1}
  } else if(kind==="bars"){
    const n=18;for(let i=0;i<n;i++){const v=(Math.sin(t/250+i*.6)+1)/2*(m?1-Math.abs(i/n-mx):.8);const bh=h*.1+v*h*.65;ctx.fillStyle=i/n<(m?mx:.6)?em:ink;ctx.globalAlpha=.75;ctx.fillRect(w*.08+i*(w*.84/n),h*.85-bh,w*.84/n-5,bh)}ctx.globalAlpha=1;
  } else if(kind==="boxes"){
    for(let i=0;i<4;i++){const x=((t/18+i*170)%(w+160))-120,y=h*(.25+i*.15),bw=70+i*8,bh=40+i*4;ctx.fillStyle=ink;ctx.globalAlpha=.12;ctx.fillRect(x,y,bw,bh);ctx.globalAlpha=1;ctx.strokeStyle=em;ctx.lineWidth=2;ctx.strokeRect(x,y,bw,bh);ctx.fillStyle=em;ctx.font="11px DM Mono, monospace";ctx.fillText(["car","bus","truck","bike"][i],x+2,y-5)}
  } else if(kind==="dots"){
    const cols=10,rows=5,s=Math.min(w/(cols+2),h/(rows+2));const filled=Math.floor((t/120)%(cols*rows+12));
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const k=r*cols+c;ctx.fillStyle=k<filled?em:css("--hair");ctx.beginPath();ctx.arc((w-cols*s)/2+c*s+s/2,(h-rows*s)/2+r*s+s/2,s*.32,0,7);ctx.fill()}
  } else if(kind==="log"){
    ctx.strokeStyle=ink;ctx.lineWidth=1.4;ctx.beginPath();for(let x=0;x<=w;x+=2){const s=x+t/10;const y=h*.5+Math.sin(s/22)*h*.12+Math.sin(s/3.1)*h*.04*(Math.sin(s/90)>.6?3:1);x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();
    ctx.fillStyle=em;ctx.globalAlpha=.15;for(let x=0;x<w;x+=2){if(Math.sin((x+t/10)/90)>.6)ctx.fillRect(x,h*.2,2,h*.6)}ctx.globalAlpha=1;
  } else { // wave: two power sources
    [[ink,0],[em,1.3]].forEach(([c,p])=>{ctx.strokeStyle=c;ctx.lineWidth=2;ctx.beginPath();for(let x=0;x<=w;x+=2){const y=h*(p?.62:.4)+Math.sin(x/38-t/350+p)*h*.12*(m&&p?1+my:1);x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()});
  }
}

/* manager for canvases that animate only while on screen */
const live=new Set();
function mountIllo(canvas, kind, host){
  const ctx=canvas.getContext("2d"); const dpr=Math.min(devicePixelRatio||1,2);
  const o={canvas,ctx,kind,m:null,vis:true,
    size(){const r=canvas.getBoundingClientRect();o.w=r.width;o.h=r.height;canvas.width=r.width*dpr;canvas.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}};
  o.size();
  (host||canvas).addEventListener("pointermove",e=>{const r=canvas.getBoundingClientRect();o.m={x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}});
  (host||canvas).addEventListener("pointerleave",()=>o.m=null);
  new IntersectionObserver(([en])=>o.vis=en.isIntersecting).observe(canvas);
  live.add(o); drawIllo(kind,ctx,o.w,o.h,0,null); return o;
}
function tick(t){ if(!reduce) live.forEach(o=>{ if(o.vis&&document.body.contains(o.canvas)) drawIllo(o.kind,o.ctx,o.w,o.h,t,o.m); else if(!document.body.contains(o.canvas)) live.delete(o)}); requestAnimationFrame(tick)}
requestAnimationFrame(tick);
addEventListener("resize",()=>live.forEach(o=>o.size()));

/* ---------- interactions ---------- */
const cur=document.querySelector(".cur");
if(finePointer){addEventListener("pointermove",e=>{cur.style.left=e.clientX+"px";cur.style.top=e.clientY+"px"})}
function hoverables(root){root.querySelectorAll("a,button,.chips span").forEach(el=>{el.addEventListener("pointerenter",()=>cur.classList.add("big"));el.addEventListener("pointerleave",()=>cur.classList.remove("big"))})}

const peek=document.querySelector(".peek"), peekC=peek.querySelector("canvas"), peekL=peek.querySelector("span");
let peekO=null, px=0, py=0, tx=0, ty=0;
function wireRows(){
  if(!finePointer) return;
  view.querySelectorAll(".row").forEach(r=>{
    r.addEventListener("pointerenter",()=>{peek.classList.add("on");peekL.textContent=r.dataset.title;
      if(peekO) live.delete(peekO); peekO=mountIllo(peekC,r.dataset.illo,r)});
    r.addEventListener("pointerleave",()=>{peek.classList.remove("on")});
    r.addEventListener("pointermove",e=>{tx=e.clientX+240;ty=e.clientY-40});
  });
  (function follow(){px+=(tx-px)*.12;py+=(ty-py)*.12;peek.style.left=px+"px";peek.style.top=py+"px";requestAnimationFrame(follow)})();
}

function observe(){
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.15});
  view.querySelectorAll(".rv,.giant,.contact").forEach(el=>io.observe(el));
  const links=[...document.querySelectorAll(".bar .nav a")];
  const spy=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){links.forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+e.target.id))}}),{rootMargin:"-45% 0px -50% 0px"});
  view.querySelectorAll("section.s").forEach(s=>spy.observe(s));
  hoverables(document);
}

/* name letters lean away from the cursor */
function nameLift(){
  if(!finePointer||reduce) return;
  const chs=[...view.querySelectorAll(".hero .ch")];
  addEventListener("pointermove",e=>{ if(document.body.classList.contains("proj")) return;
    chs.forEach(c=>{const b=c.getBoundingClientRect();const dx=e.clientX-(b.left+b.width/2),dy=e.clientY-(b.top+b.height/2);const d=Math.hypot(dx,dy);
      const f=Math.max(0,1-d/260);c.style.transform=f?`translate(${-dx/d*f*8}px,${-dy/d*f*12}px)`:""})});
}

/* ---------- scroll-reactive extras ---------- */
function extras(){
  const prog=document.querySelector(".prog"), top=document.querySelector(".totop"), ring=document.getElementById("ring");
  const track=view.querySelector(".marquee .track"), heroH=view.querySelector(".hero h1"), heroRest=[...view.querySelectorAll(".hero .blurb,.hero .cta,.hero .hint")];
  const giants=[...view.querySelectorAll(".giant,.contact .big")];
  let x=0, last=scrollY, vel=0;
  top.onclick=()=>scrollTo({top:0,behavior:"smooth"});
  setTimeout(()=>heroRest.forEach(e=>e.style.transition="opacity .15s linear"),2400);
  function frame(){
    const y=scrollY, max=document.documentElement.scrollHeight-innerHeight, p=max>0?y/max:0;
    prog.style.transform=`scaleX(${p})`;
    ring.style.strokeDashoffset=150.8*(1-p); top.classList.toggle("on",y>innerHeight*.8);
    vel+= ((y-last)-vel)*.15; last=y;
    if(!reduce){
      x-= 1.5 + Math.abs(vel)*0.5; const w=track.scrollWidth/3; if(-x>w) x+=w; track.style.transform=`translateX(${x}px)`;
      if(y<innerHeight*1.2){const k=Math.min(1,y/(innerHeight*.9));heroH.style.transform=`translateY(${y*.22}px)`;heroH.style.opacity=1-k*.85;heroRest.forEach(e=>e.style.opacity=document.body.classList.contains("ready")?1-k*1.2:"");}
      giants.forEach(g=>{const r=g.getBoundingClientRect(); if(r.bottom>0&&r.top<innerHeight){const t=(r.top-innerHeight/2)/innerHeight; g.style.transform=`translateX(${Math.max(0,(t+.5)*60)}px)`}});
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  // count-up
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;io.unobserve(e.target);const el=e.target,n=+el.dataset.count,pre=el.dataset.pre||"";const t0=performance.now();
    (function step(t){const k=Math.min(1,(t-t0)/1400),v=Math.round(n*(1-Math.pow(1-k,3)));el.textContent=pre+v;if(k<1)requestAnimationFrame(step)})(t0)}),{threshold:.6});
  view.querySelectorAll("[data-count]").forEach(el=>io.observe(el));
  // magnetic buttons
  if(finePointer&&!reduce) document.querySelectorAll(".mag").forEach(b=>{
    b.addEventListener("pointermove",e=>{const r=b.getBoundingClientRect();b.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.25}px,${(e.clientY-r.top-r.height/2)*.35}px)`});
    b.addEventListener("pointerleave",()=>b.style.transform="")});
}



/* ---------- lightbox ---------- */
const lb=document.getElementById("lb"), lbImg=lb.querySelector("img"), lbCap=lb.querySelector("figcaption");
let lbList=[], lbI=0;
const lbVid=document.createElement("video"); lbVid.controls=true; lbVid.loop=true; lbVid.playsInline=true; lbVid.muted=true; lbVid.className="lbv"; lbImg.after(lbVid);
function showLB(){const it=lbList[lbI];lbCap.innerHTML=`<b>${lbI+1} / ${lbList.length}</b>${it.cap}`;
  if(it.video){lbImg.style.display="none";lbVid.style.display="";lbVid.poster=it.src;lbVid.src=it.video;lbVid.play().catch(()=>{})}
  else{lbVid.pause();lbVid.removeAttribute("src");lbVid.style.display="none";lbImg.style.display="";lbImg.src=it.src;lbImg.alt=it.cap}
  (it.video?lbVid:lbImg).animate([{opacity:0,transform:"scale(.97)"},{opacity:1,transform:"none"}],{duration:350,easing:"ease-out"})}
function openLB(list,i=0){lbList=list;lbI=i;showLB();lb.classList.add("on");document.documentElement.style.overflow="hidden"}
function closeLB(){lbVid.pause();lb.classList.remove("on");document.documentElement.style.overflow=""}
lb.querySelector(".x").onclick=closeLB;
lb.querySelector(".pv").onclick=()=>{lbI=(lbI-1+lbList.length)%lbList.length;showLB()};
lb.querySelector(".nx").onclick=()=>{lbI=(lbI+1)%lbList.length;showLB()};
lb.addEventListener("click",e=>{if(e.target===lb)closeLB()});
addEventListener("keydown",e=>{if(!lb.classList.contains("on"))return;if(e.key==="Escape")closeLB();if(e.key==="ArrowLeft")lb.querySelector(".pv").click();if(e.key==="ArrowRight")lb.querySelector(".nx").click()});

/* events: filter + spotlight */
function wireEvents(){
  const bs=[...view.querySelectorAll(".filters button")], cards=[...view.querySelectorAll(".ev")];
  bs.forEach(b=>b.addEventListener("click",()=>{bs.forEach(x=>x.classList.toggle("on",x===b));const f=b.dataset.f;
    cards.forEach(c=>{const show=f==="all"||c.dataset.k===f;c.classList.toggle("hide",!show);if(show){c.classList.add("in");c.animate([{opacity:0,transform:"translateY(14px)"},{opacity:1,transform:"none"}],{duration:450,easing:"cubic-bezier(.2,.8,.2,1)"})}})}));
  view.querySelectorAll(".evimg").forEach(b=>b.addEventListener("click",()=>openLB(EVENTS[+b.dataset.ev].imgs,0)));
  cards.forEach(c=>c.addEventListener("pointermove",e=>{const r=c.getBoundingClientRect();c.style.setProperty("--mx",(e.clientX-r.left)+"px");c.style.setProperty("--my",(e.clientY-r.top)+"px")}));
}
